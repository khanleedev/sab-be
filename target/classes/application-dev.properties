# SERVER
server.port = 7070
#server.servlet.context-path=/api
spring.main.allow-bean-definition-overriding=true

#thread pool
thread.pool.core.size=10
thread.pool.max.size=50
thread.pool.queue.capacity=100


# Date Jackson formation
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=UTC

#JWT security
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token.expiration=${JWT_EXP_TIME}
jwt.refresh-token.expiration=${JWT_REFRESH_EXP_TIME}
jwt.cookie.access-token.name=${JWT_ACCESS_COOKIE_NAME}
jwt.cookie.refresh-token.name=${JWT_REFRESH_COOKIE_NAME}
jwt.cookie.domain=${JWT_COOKIE_DOMAIN}
jwt.cookie.secure=${JWT_COOKIE_SECURE}
jwt.sepay.secret-key=${WEBHOOK_SEPAY_API_KEY}

# Servlet Multipart
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
spring.servlet.multipart.enabled=true
server.error.whitelabel.enabled=false

# JSON handling
spring.jackson.deserialization.fail-on-unknown-properties=false
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${ADMIN_EMAIL}
spring.mail.password=${ADMIN_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.swagger-ui.operationsSorter=method
#springdoc.swagger-ui.tagsSorter=alpha

# Actuator Configuration
springdoc.show-actuator=true
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/manage
management.endpoint.health.show-details=always
management.endpoints.web.cors.allowed-origins=http://localhost:7070
management.endpoints.web.cors.allowed-methods=GET,POST

#logging
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
server.error.include-message=always
server.error.include-binding-errors=always
spring.jackson.serialization.write-dates-as-timestamps=false

# Sepay bank account
sepay.bank.accountNo=${ACCOUNT_BANK_NUMBER}
sepay.bank.bankName=${ACCOUNT_BANK_NAME}

